name: Platform CI

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [22.x]
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: npm install, build, linting, and test
        run: |
          npm ci 
          npm run build
          npm run prettier -- __tests__/fixtures/index.blade.php -w
          npm run prettier -- __tests__/fixtures/index.blade.php -c
        env:
          CI: true
